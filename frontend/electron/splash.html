<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人财务管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .splash-container {
      text-align: center;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%);
      border-radius: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
    }
    .title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 30px;
    }
    .progress-bar {
      width: 250px;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      overflow: hidden;
      margin: 0 auto;
    }
    .progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 3px;
      width: 0;
      animation: progress 2s ease-in-out infinite;
    }
    @keyframes progress {
      0% { width: 0; margin-left: 0; }
      50% { width: 60%; margin-left: 0; }
      100% { width: 0; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">💰</div>
    <div class="title">个人财务管理</div>
    <div class="subtitle">正在启动应用...</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
</body>
</html>
